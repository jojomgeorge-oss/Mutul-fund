<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4d1c14">
<title>Decade · Agent experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=Inter:wght@400;500&display=swap">
<style>
@font-face{font-family:"Reckless";src:url("../fonts/RecklessStandardS-TRIAL-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#4d1c14;font-family:Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:390px;height:849px;overflow:hidden;background:#4d1c14;transform-origin:0 0}
.press{transition:transform .18s cubic-bezier(.3,.7,.3,1)}.press:active{transform:scale(.94)}

/* status bar (the parent prototype draws its own when embedded) */
.sb{position:absolute;left:0;top:0;width:390px;height:44px;z-index:9;pointer-events:none;color:#fff}
.sb b{position:absolute;left:33px;top:14px;font:600 15px/18px -apple-system,system-ui,sans-serif;letter-spacing:-.2px}
.sb svg{position:absolute;right:15px;top:17px}
.embedded .sb{display:none}

/* top drawer */
.hbtn{position:absolute;top:54px;z-index:6;width:52px;height:43px;border-radius:27px;background:#fff;box-shadow:0 2px 20px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
#back{left:15px}#more{left:324px}
#title{position:absolute;left:0;right:0;top:54px;height:43px;z-index:5;display:flex;align-items:center;justify-content:center;gap:7px;color:#fff;font:500 19px/23px Outfit,sans-serif;pointer-events:none;transition:opacity .35s ease}
#title .t{font-family:"Reckless",Georgia,serif;font-weight:500;font-size:19px}
#title .t2{position:absolute;left:0;right:0;top:0;height:43px;display:flex;align-items:center;justify-content:center;opacity:0}
.fade{position:absolute;top:0;width:92px;height:220px;z-index:4;pointer-events:none}
.fade.l{left:0;background:linear-gradient(90deg,#4d1c14 50%,rgba(77,28,20,0))}
.fade.r{right:0;background:linear-gradient(270deg,#4d1c14 50%,rgba(77,28,20,0))}
#rail{position:absolute;left:0;width:390px;z-index:3;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#rail::-webkit-scrollbar{display:none}
#rail .in{display:flex;align-items:flex-start;justify-content:center;min-width:100%;width:max-content;padding:0 75px}
.th{position:relative;flex:none;border-radius:15px;background:rgba(255,255,255,.4);overflow:hidden;cursor:pointer}
.th .lb{position:absolute;left:0;right:0;top:9px;text-align:center;color:#f7f2f2;font:500 17px/23px Outfit,sans-serif;white-space:nowrap}
.th .g{position:absolute;left:50%;top:50%;width:95px;height:63px;margin:-31.5px 0 0 -47.5px}
.th .g svg{position:absolute;left:0;top:0;overflow:visible}
.th .dia{position:absolute;width:13px;height:18px;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.6,.5,1) .15s}
.th.done .dia{transform:scale(1)}
.th .g{opacity:0;transition:opacity .4s ease}
.th.done .g{opacity:1}
.th.gen::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.35) 50%,rgba(255,255,255,0) 80%);background-size:220% 100%;animation:shim 1.15s linear infinite}
.th.gen{background:rgba(255,255,255,.2)}
.th.gen .lb{opacity:0!important}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.th.born{animation:born .5s cubic-bezier(.3,1.3,.5,1) both}
@keyframes born{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* chat sheet */
#sheet{position:absolute;left:0;width:390px;height:849px;z-index:7;background:#f5f5f2;border-radius:23px 23px 0 0;will-change:top}
#sheet::after{content:"";position:absolute;left:0;top:0;width:390px;height:34px;border-radius:23px 23px 0 0;background:linear-gradient(#f5f5f2 55%,rgba(245,245,242,0));z-index:1;pointer-events:none}
#stage{-webkit-user-select:none;user-select:none}#q{-webkit-user-select:text;user-select:text}
#sheet .handle{position:absolute;left:150px;top:0;width:90px;height:28px;z-index:2;cursor:grab;touch-action:none}
#sheet .handle i{position:absolute;left:22px;top:9px;width:45px;height:9px;border-radius:16px;background:#d9d9d9}
#chat{position:absolute;left:0;top:0;width:390px;overflow-y:auto;overflow-x:hidden;padding:53px 0 150px;scrollbar-width:none;overscroll-behavior:contain}
#chat::-webkit-scrollbar{display:none}

.msg{position:relative;width:299px;border-radius:25px;font:500 17px/23px Outfit,sans-serif;padding:14px 17px 15px;margin-bottom:0;animation:rise .45s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.msg.u{margin-left:76px;background:#212121;color:rgba(255,255,255,.87);box-shadow:0 3px 15px rgba(0,0,0,.03)}
.msg.u .tail{position:absolute;right:0;bottom:-6px}
.read{margin:7px 30px 22px 0;text-align:right;font:400 13px/19px Outfit,sans-serif;color:#89898d}
.read b{font-weight:500}
.msg.a{margin:0 0 26px 17px;background:#fcfcfa;color:rgba(0,0,0,.71);box-shadow:0 3px 15px rgba(0,0,0,.03);padding:17px 17px 20px}
.msg.a .tail{position:absolute;left:3px;bottom:-8px;transform:rotate(7deg) scaleX(-1)}
.think{display:flex;align-items:center;gap:8px;margin:0 0 24px 17px;height:25px;font:400 13px/19px Outfit,sans-serif;color:#8d8888}
.think .lg{width:25px;height:25px;border-radius:7px;background:#fbe9e5;display:flex;align-items:center;justify-content:center;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.86);opacity:.7}}
.think span{background:linear-gradient(90deg,#8d8888 30%,#d6d2d0 50%,#8d8888 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}

/* widgets */
.wg{position:relative;width:299px;margin:0 0 26px 17px;border-radius:17px;background:#fcfcfa;box-shadow:0 2px 100px 12px rgba(0,0,0,.03);padding:17px;font-family:Inter,system-ui,sans-serif;color:#282424;animation:rise .55s cubic-bezier(.22,1,.36,1) both;transition:box-shadow .3s}
.wg.hl{box-shadow:0 0 0 3px rgba(240,71,107,.35),0 2px 100px 12px rgba(0,0,0,.03)}
.wg .hd{display:flex;gap:15px;align-items:flex-start}
.wg .lo{flex:none;width:51px;height:51px;border-radius:12px;border:1px solid #ececea;background:#fff;display:flex;align-items:center;justify-content:center;margin-top:8px}
.wg .nm{font-size:17px;line-height:23px}
.wg .mt{margin-top:4px;font-size:13px;line-height:16px;color:#787373}
.wg .rt{display:flex;align-items:center;gap:8px;margin-top:22px;font:500 23px/28px Inter,sans-serif}
.wg .rt .p{color:#3fd519}.wg .rt .p.neg{color:#e5484d}.wg .rt .tf{color:#aba6a6;margin-left:3px}
.wg .ch{position:relative;height:197px;margin-top:18px}
.wg .ch svg{position:absolute;left:0;top:0}
.wg .yl{position:absolute;right:0;font-size:12px;line-height:15px;color:#8d8888}
.wg .tfs{display:flex;justify-content:space-between;margin-top:22px;padding:0 2px}
.wg .tfs button{width:38px;height:31px;border-radius:16px;font:400 15px/18px Inter,sans-serif;color:#645f5f;transition:background .25s,color .25s}
.wg .tfs button.on{background:#000;color:#fff}
.wg .act{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:49px;margin-top:20px;border-radius:25px;background:#212121;color:#fff;font:500 16px/20px Outfit,sans-serif}
.wg .act.ok{background:#e9f7e4;color:#0b7a20}
.wg h5{margin:0;font:500 17px/23px Outfit,sans-serif;color:#282424}
.wg .sub{margin-top:3px;font-size:13px;line-height:16px;color:#787373}
.bars{display:flex;align-items:flex-end;justify-content:space-around;height:170px;margin-top:20px;border-bottom:1px solid #ececea}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:6px;width:70px}
.bars .b i{display:block;width:44px;border-radius:7px 7px 0 0;background:#e4e1df;height:0;transition:height .8s cubic-bezier(.22,1,.36,1)}
.bars .b.me i{background:#3fd519}
.bars .b em{font:500 14px/17px Inter,sans-serif;font-style:normal}
.bars .b.me em{color:#2a9d12}
.bl{display:flex;justify-content:space-around;margin-top:8px;font-size:12px;line-height:15px;color:#787373;text-align:center}
.bl span{width:80px}
.calc .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;font-size:14px;color:#787373}
.calc .row b{font:500 19px/23px Inter,sans-serif;color:#282424}
.calc input[type=range]{width:100%;margin:12px 0 0;accent-color:#212121}
.calc .yrs{display:flex;gap:8px;margin-top:14px}
.calc .yrs button{flex:1;height:34px;border-radius:17px;background:#f0efec;font:400 14px/17px Inter,sans-serif;color:#645f5f}
.calc .yrs button.on{background:#000;color:#fff}
.calc .res{margin-top:18px;padding:15px;border-radius:13px;background:#f3f8f1}
.calc .res small{display:block;font-size:13px;color:#5d7a55}
.calc .res b{display:block;margin-top:4px;font:500 27px/32px Inter,sans-serif;color:#1b7a0e;letter-spacing:.02em}
.calc .res p{margin:6px 0 0;font-size:12px;line-height:16px;color:#6f8a68}

.why{margin-top:14px}
.wr{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #efedea}
.wr:first-child{border-top:0}
.wr .v{flex:none;width:52px;padding:4px 0;border-radius:8px;background:#eaf7e5;color:#2a9d12;font:500 13px/16px Inter,sans-serif;text-align:center}
.wr .v.neg{background:#fdecec;color:#d23c41}
.wr b{display:block;font:500 15px/20px Inter,sans-serif}.wr small{display:block;margin-top:2px;font-size:12px;line-height:16px;color:#787373}
.dn{display:flex;align-items:center;gap:18px;margin-top:18px}
.lg2{flex:1;display:flex;flex-direction:column;gap:12px}
.lg2 div{display:flex;align-items:center;gap:8px;font-size:13px;color:#645f5f}
.lg2 i{width:10px;height:10px;border-radius:3px}.lg2 b{margin-left:auto;font:500 14px/17px Inter,sans-serif;color:#282424}
.nx{display:flex;gap:14px;align-items:center;margin-top:16px}
.nx .cal{flex:none;width:52px;height:56px;border-radius:12px;border:1px solid #ececea;background:#fff;text-align:center;overflow:hidden}
.nx .cal small{display:block;height:18px;background:#4d1c14;color:#fff;font:500 11px/18px Inter,sans-serif;letter-spacing:.06em}
.nx .cal b{display:block;font:500 22px/36px Inter,sans-serif}
.nx > div b{display:block;font:500 16px/21px Inter,sans-serif}.nx > div small{display:block;margin-top:3px;font-size:12px;line-height:16px;color:#787373}
.row2{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid #efedea;font-size:13px;color:#787373}.row2 b{font:500 14px/17px Inter,sans-serif;color:#282424}
/* empty state */
.hello{position:absolute;left:17px;right:17px;bottom:0;display:flex;flex-direction:column;align-items:flex-start;gap:9px;transition:opacity .3s}
.hello p{margin:0 0 6px 3px;font:400 15px/21px Outfit,sans-serif;color:#8d8888}
.chip{padding:10px 16px;border-radius:21px;border:1px solid #dedad6;background:#fcfcfa;font:400 15px/20px Outfit,sans-serif;color:#3a3535;text-align:left}

/* input */
#bar{position:absolute;left:12.5px;top:752px;z-index:8;width:365px;height:69px;border-radius:130px;background:#f9f9f9;border:.9px solid #8d8888;box-shadow:0 4px 20px rgba(0,0,0,.03);display:flex;align-items:center}
#bar::before{content:"";position:absolute;inset:0;border-radius:48px;border-top:6.5px solid rgba(255,255,255,.63);border-bottom:6.5px solid rgba(255,255,255,.63);pointer-events:none}
#bar .plus{width:44px;height:44px;margin-left:5px;display:flex;align-items:center;justify-content:center}
#bar .av{flex:none;width:39px;height:39px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#ffd9c7 0 23%,transparent 24%),radial-gradient(circle at 50% 100%,#212121 0 46%,transparent 47%),#7fd3d6;border:2px solid #fff;box-shadow:0 0 0 1px #e6e3e0}
#q{flex:1;min-width:0;height:44px;margin-left:11px;border:0;outline:0;background:none;font:400 18px/22px Outfit,sans-serif;color:#212121}
#q::placeholder{color:#8d8888}
#send{flex:none;width:44px;height:44px;margin-right:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .25s}
#send.go{background:#4d1c14}
#send .mic,#send .arr{position:absolute;transition:opacity .2s,transform .25s}
#send .arr{opacity:0;transform:scale(.6)}
#send.go .mic{opacity:0;transform:scale(.6)}#send.go .arr{opacity:1;transform:none}

.toast{position:absolute;left:50%;top:700px;z-index:20;transform:translateX(-50%);padding:10px 16px;border-radius:20px;background:#212121;color:#fff;font:400 14px/18px Outfit,sans-serif;white-space:nowrap;animation:rise .35s ease both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body>
<div id="stage">
  <div class="sb"><b>9:41</b><svg width="67" height="12" viewBox="0 0 67 12" fill="#fff"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/><path d="M29 2.6c2.2 0 4.2.8 5.7 2.2l1-1A9.6 9.6 0 0 0 29 1.1c-2.6 0-5 1-6.7 2.7l1 1C24.8 3.4 26.8 2.6 29 2.6Zm0 3c1.4 0 2.6.5 3.6 1.4l1-1A6.6 6.6 0 0 0 29 4.1c-1.8 0-3.4.7-4.6 1.9l1 1c1-.9 2.2-1.4 3.6-1.4Zm0 3c.6 0 1.1.2 1.5.6L29 10.7l-1.5-1.5c.4-.4.9-.6 1.5-.6Z"/><rect x="42.5" y=".5" width="21" height="10.3" rx="2.7" fill="none" stroke="#fff" opacity=".4"/><rect x="44.3" y="2.3" width="17.4" height="6.7" rx="1.4"/><path d="M65 4v3.3c.7-.3 1.2-1 1.2-1.7S65.7 4.3 65 4Z" opacity=".5"/></svg></div>

  <div class="fade l"></div><div class="fade r"></div>
  <div id="title"><span class="t1" style="display:flex;align-items:center;gap:7px"><svg width="19" height="19" viewBox="0 0 25 26" fill="none"><path d="M24.93 12.6c0 3.48-1.41 6.63-3.69 8.91a12.56 12.56 0 0 1-8.91 3.69H3.1V22.1l9.5-9.5-1.39-1.39-4.7 4.7H3.1V3.1L0 0h12.32c6.96 0 12.6 5.64 12.6 12.6Z" fill="#fff"/></svg><span class="t">Ask Decade</span></span><span class="t2" id="t2">Portfolio review</span></div>
  <div id="rail"><div class="in" id="rin"></div></div>
  <button class="hbtn press" id="back" aria-label="Back"><svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M7.5 1.5 1.5 8l6 6.5" stroke="#212121" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="hbtn press" id="more" aria-label="New chat"><svg width="17" height="17" viewBox="0 0 17 17" fill="#212121"><circle cx="2.5" cy="8.5" r="2"/><circle cx="8.5" cy="8.5" r="2"/><circle cx="14.5" cy="8.5" r="2"/></svg></button>

  <div id="sheet">
    <div class="handle" id="handle" role="button" aria-label="Pull down to see all widgets"><i></i></div>
    <div id="chat"></div>
  </div>

  <form id="bar" autocomplete="off">
    <button type="button" class="plus press" aria-label="Attach"><svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M8.5 1.5v14M1.5 8.5h14" stroke="#212121" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <span class="av" aria-hidden="true"></span>
    <input id="q" placeholder="Ask Decade" aria-label="Ask Decade" enterkeyhint="send">
    <button type="submit" id="send" aria-label="Send"><svg class="mic" width="20" height="26" viewBox="0 0 20 26" fill="none"><rect x="5.5" y="1" width="9" height="15" rx="4.5" stroke="#8d8888" stroke-width="1.8"/><path d="M1.5 11.5a8.5 8.5 0 0 0 17 0M10 20v4.5" stroke="#8d8888" stroke-width="1.8" stroke-linecap="round"/></svg><svg class="arr" width="14" height="18" viewBox="0 0 13 18"><path d="M1.78 17.79l10.35-7.07c1.14-.78 1.14-2.68 0-3.46L1.78.19C.84-.45-.3.62.07 1.81L2 8.02l3.71.97L2 9.96.07 16.17c-.37 1.2.76 2.27 1.71 1.62Z" fill="#fff"/></svg></button>
  </form>
</div>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const stage = $('#stage'), sheet = $('#sheet'), chat = $('#chat'), rail = $('#rail'), rin = $('#rin'), title = $('#title'), q = $('#q'), send = $('#send');
const EMB = window.parent !== window && !/[?&]mock\b/.test(location.search); // ?mock = shown inside the phone-frame page
if (EMB) document.body.classList.add('embedded');
const post = (m) => { if (EMB) try { parent.postMessage(m, '*'); } catch (_) {} };
if (EMB) document.addEventListener('pointerup', () => post({ decade: 'tap' }), { once: true, capture: true });
post({ decade: 'agentTop', dark: true });
let K = 1;
function fit() {
  if (EMB) { K = 1; stage.style.transform = ''; return; }
  const w = innerWidth, h = innerHeight; K = Math.min(w / 390, h / 849);
  stage.style.transform = `translate(${(w - 390 * K) / 2}px, ${(h - 849 * K) / 2}px) scale(${K})`;
}
fit(); addEventListener('resize', fit);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const inr = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; stage.appendChild(el); setTimeout(() => el.remove(), 1900); }

const LOGO = (c = '#4d1c14', s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 25 26" fill="none"><path d="M24.93 12.6c0 3.48-1.41 6.63-3.69 8.91a12.56 12.56 0 0 1-8.91 3.69H3.1V22.1l9.5-9.5-1.39-1.39-4.7 4.7H3.1V3.1L0 0h12.32c6.96 0 12.6 5.64 12.6 12.6Z" fill="${c}"/></svg>`;
const TAIL_U = '<svg class="tail" width="24" height="14" viewBox="0 0 18 14" fill="none"><path d="M0 0h14c0 5 1.5 10 4 14-6-1-11-4-14-8L0 0Z" fill="#212121"/></svg>';
const TAIL_A = '<svg class="tail" width="21" height="16" viewBox="0 0 18 14" fill="none"><path d="M0 0h14c0 5 1.5 10 4 14-6-1-11-4-14-8L0 0Z" fill="#fcfcfa"/></svg>';
const DIA = '<svg class="dia" viewBox="0 0 13 18" width="13" height="18"><path d="M6.5 1 12 9l-5.5 8L1 9Z" fill="#f0476b" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>';

/* ---------- thumbnails (drawn in a 95 × 63 box, as in Figma) ---------- */
const W60 = 'rgba(255,255,255,.6)', GL = 'rgba(77,28,20,.55)';
const GFX = {
  calc: `<svg width="95" height="63" viewBox="0 0 95 63"><rect x="28" y="11" width="18" height="18" rx="3" fill="${W60}"/><rect x="49" y="11" width="18" height="18" rx="3" fill="${W60}"/><rect x="28" y="34" width="18" height="18" rx="3" fill="${W60}"/><rect x="49" y="34" width="18" height="18" rx="3" fill="${W60}"/>
    <g stroke="${GL}" stroke-width="1.3" stroke-linecap="round"><path d="M37 16.5v7M33.5 20h7M55.5 17.5l5 5M60.5 17.5l-5 5M33.5 43h7M54.5 43h7"/></g><circle cx="58" cy="39.8" r=".9" fill="${GL}"/><circle cx="58" cy="46.2" r=".9" fill="${GL}"/></svg>`,
