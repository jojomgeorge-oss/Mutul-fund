<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Decade · Agent experience</title>
<meta name="theme-color" content="#212121">
<style>
@font-face{font-family:"GT Walsheim";src:url("../fonts/GT-Walsheim-Regular-Trial.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"GT Walsheim";src:url("../fonts/GT-Walsheim-Medium-Trial.otf") format("opentype");font-weight:500;font-display:swap}
@font-face{font-family:"Reckless";src:url("../fonts/RecklessStandardS-TRIAL-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
:root{--ink:#212121;--paper:#fcfcfa;--line:#dfdcda;--mute:#645f5f;--grey:#9e9999;--soft:#f5f5f2;--sans:"GT Walsheim","DM Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--serif:"Reckless","Source Serif 4",Georgia,serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7a7a7a;overscroll-behavior:none}
body.embedded{background:#212121}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#stage{position:absolute;left:0;top:0;width:390px;height:849px;overflow:hidden;transform-origin:0 0;background:var(--ink);font-family:var(--sans);color:#000;contain:strict;-webkit-user-select:none;user-select:none}
.serif{font-family:var(--serif);font-weight:500}
.hatch{background:var(--soft) repeating-linear-gradient(45deg,rgba(0,0,0,.18) 0 1px,transparent 1px 6px)}
.sbar{position:absolute;left:0;top:0;width:390px;height:44px;z-index:60;pointer-events:none;color:#fff}
.sbar span{position:absolute;left:32px;top:13px;font-size:16px;font-weight:600;font-family:-apple-system,system-ui,sans-serif}
.sbar i{position:absolute;right:24px;top:17px;width:62px;height:11px;border-radius:3px;background:linear-gradient(90deg,currentColor 0 18px,transparent 18px 24px,currentColor 24px 38px,transparent 38px 44px,currentColor 44px)}
.sbar{transition:color .4s}.notray .sbar{color:#000}
body.embedded .sbar{display:none}

/* top: round buttons + widget tiles */
.rbtn{position:absolute;top:50px;width:52px;height:43px;border:0;border-radius:27px;background:#fff;box-shadow:0 2px 20px rgba(0,0,0,.08);display:inline-flex;align-items:center;justify-content:center;padding:0;z-index:30;transition:opacity .3s}
#burger{left:15px}#more{left:323px}
#tiles{position:absolute;left:0;top:38px;width:390px;height:68px;z-index:20;transform-origin:195px 34px;will-change:transform}
.tscroll{display:flex;gap:6.6px;align-items:center;height:100%;overflow-x:auto;scrollbar-width:none;padding:0 153px;scroll-snap-type:x mandatory;touch-action:pan-x}
.tscroll::-webkit-scrollbar{display:none}
.tile{flex:none;width:84px;height:50px;border-radius:9px;border:0;background:var(--paper);padding:3px 6px 0;position:relative;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center}
.tile small{font-size:7px;letter-spacing:.06em;color:#787373;line-height:9px}
.tile svg{margin-top:2px}
.tile.on::after{content:"";position:absolute;inset:-3px;border:1.2px solid #fff;border-radius:11.5px}
.tile.load{background:linear-gradient(100deg,#f4f4f4 20%,#c9c9c9 50%,#f4f4f4 80%);background-size:250% 100%;animation:sh 1.3s linear infinite;justify-content:center}
.tile.load small{color:#6b6b6b}
.tile.empty{background:none;border:1px dashed rgba(255,255,255,.35)}
.tile.new{animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.fade{position:absolute;top:0;height:117px;width:150px;pointer-events:none;z-index:25}
.fade.l{left:0;background:linear-gradient(90deg,var(--ink) 38%,rgba(33,33,33,0))}
.fade.r{right:0;background:linear-gradient(270deg,var(--ink) 38%,rgba(33,33,33,0))}

/* sheet */
#sheet{position:absolute;left:0;top:117px;width:390px;height:732px;background:var(--paper);border-radius:23px 23px 0 0;z-index:15;will-change:transform;transition:transform .42s var(--ease),top .55s var(--ease),height .55s var(--ease),border-radius .55s}
.notray #sheet{top:0;height:849px;border-radius:0}
.notray .grab{opacity:0;pointer-events:none}
.notray #tiles,.notray .fade{opacity:0;pointer-events:none}
.fade{transition:opacity .4s}
.notray #chat{top:105px}
.grab{position:absolute;left:0;top:0;width:390px;height:34px;touch-action:none;display:flex;justify-content:center;padding-top:9px;cursor:grab;z-index:3;transition:opacity .4s}
.grab::before{content:"";width:45px;height:9px;border-radius:16px;background:#d9d9d9}
#chat{position:absolute;left:0;top:30px;width:390px;bottom:0;overflow-y:auto;transition:top .55s var(--ease);padding:20px 23px 160px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
#chat::-webkit-scrollbar{display:none}
.hello{margin-top:150px}
.hello h1{margin:0 0 8px;font-size:26px;line-height:31px;color:var(--ink)}
.hello p{margin:0 0 16px;font-size:15px;line-height:20px;color:var(--mute)}
.hello .qs{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.pill{border:1px solid var(--line);background:#fff;border-radius:100px;padding:10px 16px;font-size:15px;color:var(--ink);text-align:left}
.pill:active{background:#f3f3f3}
.um{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:299px;animation:rise .3s var(--ease)}
.u{position:relative;background:var(--ink);color:#fff;border-radius:25px;padding:16px 17px;font-size:17px;line-height:22px;box-shadow:0 3px 30px rgba(0,0,0,.03)}
.u svg{position:absolute;right:-6px;bottom:-1px}
.um time{font-size:13px;color:#9e9999;margin-right:23px}
.a{display:flex;flex-direction:column;gap:16px;animation:rise .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;border:2px solid #000;background:#fff;border-radius:100px;padding:13px 17px;font-size:17px;color:var(--ink);box-shadow:0 3px 30px rgba(0,0,0,.03)}
.lcard{height:134px;border-radius:23px;background:linear-gradient(100deg,#f4f4f4 15%,#cfcfcf 45%,#cfcfcf 55%,#f4f4f4 85%);background-size:250% 100%;animation:sh 1.6s linear infinite;display:flex;align-items:center;justify-content:center;color:#999;font-size:17px}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
.desc{margin:0;font-size:17px;line-height:23px;color:#000;padding-right:12px}
.desc.sk{display:flex;flex-direction:column;gap:9px}
.desc.sk i{display:block;height:12px;border-radius:6px;background:#e6e6e6}

/* widget card */
.wg{background:#fff;border-radius:23px;box-shadow:0 4px 100px rgba(0,0,0,.05),0 1px 3px rgba(0,0,0,.04);overflow:hidden;transition:box-shadow .3s}
#full .wg{box-shadow:none}
.wg.flash{box-shadow:0 0 0 3px #212121}
.ch{display:flex;align-items:center;gap:16px;padding:16px 20px 15px 17px}
.logo{width:45px;height:45px;border-radius:11px;flex:none}
.logo.sm{width:27px;height:27px;border-radius:7px}
.ch b{flex:1;font-size:19px;line-height:23px;color:var(--ink)}
.cb{border-top:1px solid var(--line);padding:16px 20px 18px 23px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.num{font-size:21px;font-weight:500;color:var(--ink);line-height:26px}
.num.big{font-size:26px}
.lab{font-size:15px;color:var(--mute);line-height:19px}
.r{text-align:right}
.tabs{display:inline-flex;background:#f3f3f1;border-radius:100px;padding:3px}
.tabs button{border:0;background:none;border-radius:100px;padding:5px 11px;font-size:13px;color:var(--mute)}
.tabs button.on{background:var(--ink);color:#fff}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--grey);margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin:22px 0 6px;border-bottom:1px solid var(--line)}
.bars button{flex:1;border:1.4px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;padding:0;position:relative}
.bars button.on{background:var(--ink)}
.bars button span{position:absolute;left:0;right:0;top:-18px;font-size:12px;font-weight:500;color:var(--ink)}
.blab{display:flex;gap:10px}.blab span{flex:1;text-align:center;font-size:11px;color:var(--grey)}
.rng{width:100%;margin:14px 0 10px;accent-color:#212121}
.yr{display:flex;gap:6px}
.yr button{border:1px solid var(--line);background:#fff;border-radius:100px;padding:5px 11px;font-size:13px;color:var(--ink)}
.yr button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#eee;margin-bottom:12px}
.split i{display:block;background:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 4px;text-align:center;border-bottom:1px solid #eeeceb}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;color:var(--mute);font-size:13px}
.tbl th button{border:0;background:none;font-size:13px;font-weight:500;padding:4px 8px;border-radius:100px;color:var(--ink)}
.tbl th.on button{background:var(--ink);color:#fff}
.tbl td.on{font-weight:500;background:#f5f5f3}
.donut{display:flex;align-items:center;gap:16px}
.legend{flex:1;display:flex;flex-direction:column;gap:2px}
.legend button{display:flex;align-items:center;gap:9px;border:0;border-radius:10px;background:none;padding:6px 8px;font-size:14px;text-align:left;color:var(--ink)}
.legend button.on{background:#f3f3f1}
.legend i{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid var(--ink)}
.legend b{margin-left:auto;font-weight:500}
.chk{display:flex;flex-direction:column;gap:2px}
.chk button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:8px 0;font-size:15px;text-align:left;color:var(--ink)}
.chk button i{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:6px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.chk button.on i{background:var(--ink)}
.chk button.on i::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chk button.on span{text-decoration:line-through;color:var(--grey)}
.prog{height:4px;border-radius:2px;background:#eee;margin:8px 0 6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}

/* action card: outline only, nothing filled */
.act{background:transparent;border:1.5px solid var(--ink);border-radius:23px}
.act .ah{display:flex;align-items:center;gap:11px;padding:14px 17px 12px}
.act .ah b{font-size:15px;color:var(--ink)}
.act .logo{background:transparent;border:1.2px solid var(--ink)}
.act .ab{border-top:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:16px 16px 18px 21px}
.act small{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
.act .val b{font-size:19px;font-weight:500;color:var(--ink)}.act .val span{font-size:15px;color:var(--ink);margin-left:1px}
.inv{height:38px;min-width:107px;padding:0 18px;border:1.5px solid var(--ink);border-radius:33px;background:transparent;color:var(--ink);font-size:15px;font-weight:500}
.inv:active{background:rgba(33,33,33,.06)}
.act.done{border-style:dashed}
.act.done .inv{border-style:dashed}
.act.sk{border:1.5px dashed #c9c6c4}
.act.sk .ab{border-top-color:#e6e4e2}
.act.sk .logo{border-color:#c9c6c4}
/* composer */
.cmp{position:absolute;left:0;bottom:0;width:390px;padding:0 0 22px;z-index:4;background:linear-gradient(rgba(252,252,250,0),var(--paper) 30%)}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:14px 13px 10px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg .pill{flex:none;padding:7px 13px;font-size:13.5px;white-space:nowrap}
.inp{margin:0 13px;height:69px;border-radius:59px;background:#fff;box-shadow:0 2px 30px rgba(0,0,0,.15);display:flex;align-items:center;padding:0 12px 0 27px;gap:10px}
.inp input{flex:1;border:0;outline:0;background:none;font-size:18px;color:var(--ink);min-width:0;-webkit-user-select:text;user-select:text}
.inp input::placeholder{color:#8d8888}
.send{width:52px;height:45px;border-radius:27px;border:0;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0 0 0 3px;flex:none}
.send:disabled{opacity:.35}

/* drawer + menu */
.sb-card{height:130px;border:0;border-radius:15px;background:#d9d9d9;padding:13px 15px 13px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:rgba(0,0,0,.87);position:relative}
.sb-card b{font-size:17px;line-height:21px;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sb-card small{font-size:13px;line-height:21px}
.sb-card.on{box-shadow:inset 0 0 0 1.5px #212121}
.sb-card:active{filter:brightness(.96)}
.sb-item{display:block;width:100%;border:0;background:none;text-align:left;padding:8px 26px 9px}
.sb-item b{display:block;font-size:19px;line-height:23px;font-weight:400;color:#212121;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item small{display:block;font-size:13px;line-height:21px;color:rgba(0,0,0,.87);margin-top:5px}
.sb-item.on b{text-decoration:underline;text-underline-offset:4px}
.sb-item+.sb-item{margin-top:16px}
/* landing (Chats tab) */
#home{position:absolute;inset:0;z-index:50;background:#fff;transition:transform .42s var(--ease),opacity .3s ease;will-change:transform}
#stage.inchat #home{transform:translate3d(-28%,0,0);opacity:0;pointer-events:none}
#stage:not(.inchat) .sbar{color:#000}
.hpage{position:absolute;inset:0;overflow-y:auto;padding:52px 0 190px;scrollbar-width:none}
.hpage::-webkit-scrollbar{display:none}
.hpage[hidden]{display:none}
.h-actions{display:flex;align-items:center;justify-content:center;margin:0 27px 0 28px;width:335px;height:150px;border:0;border-radius:20px;background:#d9d9d9;font-size:19px;color:#000}
.h-h{margin:20px 28px 20px 27px;font-size:19px;line-height:23px;color:#000}
.h-grid{display:grid;grid-template-columns:159px 159px;gap:19px 17px;padding:0 27px 0 28px}
.h-grid .sb-card{width:159px}
.h-list{padding:42px 0 0}
.h-list .sb-item{padding:8px 28px 9px}
.h-list .sb-item+.sb-item{margin-top:28px}
.h-ph{margin:0 28px;display:flex;flex-direction:column;gap:14px}
.h-ph h2{margin:0 0 6px;font-size:26px;line-height:31px;color:var(--ink)}
.h-ph .blk{height:120px;border-radius:20px;background:#d9d9d9;display:flex;align-items:center;justify-content:center;font-size:17px;color:#000;border:0;width:100%}
.h-ph .blk.sm{height:84px}
.h-ph p{margin:0;font-size:15px;line-height:20px;color:var(--mute)}
.hbottom{position:absolute;left:0;bottom:0;width:390px;padding:40px 13px 18px;background:linear-gradient(rgba(255,255,255,0),#fff 38%);display:flex;flex-direction:column;gap:9px;z-index:2}
.hbottom .inp{margin:0;border:0;width:100%;box-shadow:0 2px 30px rgba(0,0,0,.15);cursor:text;font:inherit}
#home::before{content:"";position:absolute;left:0;top:0;width:390px;height:48px;background:linear-gradient(#fff 80%,rgba(255,255,255,0));z-index:3;pointer-events:none}
.hbottom .inp span{flex:1;font-size:18px;color:#8d8888}
.bnav{height:64px;border:1px solid #555;border-radius:37px;background:#fff;display:flex;align-items:stretch;padding:0 12px}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:13px;color:rgba(0,0,0,.87);padding:0}
.bnav button i{width:19px;height:19px;background:#d9d9d9;display:block}
.bnav button.on i{background:#212121}
.bnav button.on{font-weight:500}
#menu{position:absolute;right:15px;top:100px;z-index:72;background:#fff;border-radius:18px;box-shadow:0 8px 40px rgba(0,0,0,.18);padding:6px;display:none;min-width:170px}
#menu.on{display:block}
#menu button{display:block;width:100%;border:0;background:none;text-align:left;padding:11px 14px;border-radius:12px;font-size:15px;color:var(--ink)}
#menu button:active{background:#f3f3f3}
#toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,10px);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:100px;opacity:0;pointer-events:none;transition:all .25s;z-index:90;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="stage" class="notray">
  <div class="sbar" aria-hidden="true"><span>9:41</span><i></i></div>


  <div id="tiles"><div class="tscroll" id="tscroll"></div></div>
  <div class="fade l"></div><div class="fade r"></div>
  <button class="rbtn" id="burger" aria-label="Close chat"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 2l12 12M14 2 2 14" stroke="#212121" stroke-width="2" stroke-linecap="round"/></svg></button>
  <button class="rbtn" id="more" aria-label="More"><svg width="17" height="17" viewBox="0 0 17 17" fill="#212121"><circle cx="2.5" cy="8.5" r="2"/><circle cx="8.5" cy="8.5" r="2"/><circle cx="14.5" cy="8.5" r="2"/></svg></button>

  <section id="sheet">
    <div class="grab" id="grab" aria-label="Drag down to enlarge the widget tray"></div>
    <div id="chat" aria-live="polite"></div>
    <div class="cmp">
      <div class="sugg" id="sugg"></div>
      <form class="inp" id="form" autocomplete="off">
        <svg width="19" height="19" viewBox="0 0 25 26" fill="none"><path d="M24.93 12.6c0 3.48-1.41 6.63-3.69 8.91a12.56 12.56 0 0 1-8.91 3.69H3.1V22.1l9.5-9.5-1.39-1.39-4.7 4.7H3.1V3.1L0 0h12.32c6.96 0 12.6 5.64 12.6 12.6Z" fill="#8d8888"/></svg>
        <input id="q" type="text" placeholder="Ask Decade" aria-label="Message">
        <button class="send" id="sendBtn" type="submit" aria-label="Send" disabled><svg width="13" height="18" viewBox="0 0 13 18"><path d="M1.78 17.79l10.35-7.07c1.14-.78 1.14-2.68 0-3.46L1.78.19C.84-.45-.3.62.07 1.81L2 8.02l3.71.97L2 9.96.07 16.17c-.37 1.2.76 2.27 1.71 1.62Z" fill="#fff"/></svg></button>
      </form>
    </div>
  </section>

  <section id="home" aria-label="Agent home">
    <div class="hpage" data-page="chats">
      <button class="h-actions" id="hActions">Actions</button>
      <div class="h-h">Consultations</div>
      <div class="h-grid" id="homeGrid"></div>
      <div class="h-list" id="homeList"></div>
    </div>
    <div class="hpage" data-page="invest" hidden><div class="h-ph"><h2 class="serif">Invest</h2>
      <button class="blk" data-go="funds">Mutual funds</button><button class="blk" data-go="fd">Fixed deposit</button><p>Opens those sections of the app.</p></div></div>
    <div class="hpage" data-page="portfolio" hidden><div class="h-ph"><h2 class="serif">Portfolio</h2><div class="blk">Holdings</div><div class="blk sm">Goals</div><p>Not in this prototype yet.</p></div></div>
    <div class="hpage" data-page="profile" hidden><div class="h-ph"><h2 class="serif">Profile</h2><div class="blk sm">Account</div><div class="blk sm">Settings</div><p>Not in this prototype yet.</p></div></div>
    <div class="hbottom">
      <button class="inp" id="homeAsk" type="button" aria-label="Ask Decade: start a new chat">
        <svg width="19" height="19" viewBox="0 0 25 26" fill="none"><path d="M24.93 12.6c0 3.48-1.41 6.63-3.69 8.91a12.56 12.56 0 0 1-8.91 3.69H3.1V22.1l9.5-9.5-1.39-1.39-4.7 4.7H3.1V3.1L0 0h12.32c6.96 0 12.6 5.64 12.6 12.6Z" fill="#8d8888"/></svg>
        <span style="text-align:left">Ask Decade</span>
        <span class="send" style="flex:none;font-size:0"><svg width="13" height="18" viewBox="0 0 13 18"><path d="M1.78 17.79l10.35-7.07c1.14-.78 1.14-2.68 0-3.46L1.78.19C.84-.45-.3.62.07 1.81L2 8.02l3.71.97L2 9.96.07 16.17c-.37 1.2.76 2.27 1.71 1.62Z" fill="#fff"/></svg></span>
      </button>
      <nav class="bnav" aria-label="Main">
        <button class="on" data-tab="chats"><i></i>Chats</button><button data-tab="invest"><i></i>Invest</button><button data-tab="portfolio"><i></i>portfolio</button><button data-tab="profile"><i></i>Profile</button>
      </nav>
    </div>
  </section>
  <div id="menu"><button id="mNew">New consultation</button><button id="mOpen">Expand widget tray</button></div>
  <div id="toast"></div>
</div>

<script>
(() => {

}
function syncFromChat() {
  syncRaf = 0; if (!hasTray || Date.now() < lockSync) return;
  const els = [...chatEl.querySelectorAll('[data-where="chat"]')]; if (!els.length) return;
  const mid = chatEl.scrollTop + chatEl.clientHeight * 0.45; let pick = els[0];
  for (const el of els) if (el.offsetTop <= mid) pick = el;
  if (chatEl.scrollTop + chatEl.clientHeight >= chatEl.scrollHeight - 4) pick = els[els.length - 1];
  setActive(pick.dataset.w);
}
chatEl.addEventListener('scroll', () => { if (!syncRaf) syncRaf = requestAnimationFrame(syncFromChat); }, { passive: true });
function renderSugg() {
  const used = new Set(cur.msgs.filter((m) => m.role === 'u').map((m) => m.text));
  $('#sugg').innerHTML = cur.msgs.length ? SUGG.filter((s) => !used.has(s.q)).map((s) => `<button class="pill" data-sugg="${esc(s.q)}">${esc(s.q)}</button>`).join('') : '';
}
function renderAll() { renderChat(); renderTiles(); renderSugg(); scrollEnd(); widgets().forEach((w) => { w.fresh = false; }); }
function scrollEnd() { requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; }); }
function refreshWidget(w) {
  document.querySelectorAll(`[data-w="${w.id}"]`).forEach((el) => { const t = document.createElement('div'); t.innerHTML = widgetHTML(w, el.dataset.where); el.replaceWith(t.firstElementChild); });
}

/* ---------- sending ---------- */
const input = $('#q'), sendBtn = $('#sendBtn');
let busy = false;
input.addEventListener('input', () => { sendBtn.disabled = !input.value.trim() || busy; });
$('#form').addEventListener('submit', (e) => { e.preventDefault(); const q = input.value.trim(); if (q && !busy) { input.value = ''; sendBtn.disabled = true; input.blur(); send(q); } });
function send(q, plan) {
  busy = true;
  if (!chats.includes(cur)) chats.unshift(cur);
  if (cur.title === 'New consultation') cur.title = q.length > 30 ? q.slice(0, 29) + '…' : q;
  cur.msgs.push({ role: 'u', text: q, time: now() });
  const p = plan || (SUGG.find((s) => s.q === q) || {}).p || detect(q);
  const r = makeReply(q, p); if (r.widget) r.widget.loading = true;
  const chat = cur;
  renderAll();
  setTimeout(() => {
    chat.msgs.push(r);
    if (chat === cur) { renderChat(); renderTiles(); scrollEnd(); }
    setTimeout(() => {
      r.loading = false; if (r.widget) { r.widget.loading = false; r.widget.fresh = true; }
      busy = false; sendBtn.disabled = !input.value.trim();
      if (chat === cur) renderAll();
    }, 1700 + (hash(q) % 700));
  }, 350);
}

/* ---------- interactions ---------- */
function findWidget(el) { const host = el.closest('[data-w]'); if (!host) return null; for (const c of [cur, ...chats]) for (const m of c.msgs) if (m.widget && m.widget.id === host.dataset.w) return m.widget; return null; }
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1600); }
stage.addEventListener('click', (e) => {
  if (suppress) { e.preventDefault(); e.stopPropagation(); return; }
  if (!e.target.closest('#menu,#more')) $('#menu').classList.remove('on');
  const t = e.target.closest('[data-act],[data-sugg],[data-tile],[data-goto],[data-chat]');
  if (!t) return;
  if (t.dataset.sugg) { if (!busy) send(t.dataset.sugg); return; }
  if (t.dataset.tile) { const w = widgets().find((x) => x.id === t.dataset.tile); if (w && w.loading) { toast('Still generating…'); return; } lockSync = Date.now() + 900; setActive(t.dataset.tile, true); goTo(t.dataset.tile); return; }
  
  if (t.dataset.chat) { const c = [cur, ...chats].find((x) => x.id === t.dataset.chat); if (c) { cur = c; renderAll(); enterChat(); } return; }
  const act = t.dataset.act;
  if (act === 'pri') {
    const card = t.closest('[data-m]'); const m = cur.msgs.find((x) => x.id === card.dataset.m); if (!m) return;
    m.action.done = !m.action.done; const d = document.createElement('div'); d.innerHTML = actionHTML(m); card.replaceWith(d.firstElementChild);
    if (m.action.done) toast(`${ACTS[m.action.key][4]} → opens that flow`); return;
  }
  const w = findWidget(t); if (!w) return; const v = +t.dataset.v;
  if (act === 'tab') w.tab = v; else if (act === 'bar' || act === 'seg') w.sel = v; else if (act === 'yrs') w.yrs = v; else if (act === 'pick') w.pick = v; else if (act === 'chk') w.done[v] = !w.done[v]; else return;
  refreshWidget(w);
});
stage.addEventListener('input', (e) => {
  if (e.target.dataset.act !== 'amt') return;
  const w = findWidget(e.target); if (!w) return; w.amt = +e.target.value; const { fv, inv } = calcVals(w);
  document.querySelectorAll(`[data-w="${w.id}"]`).forEach((el) => {
    el.querySelector('[data-o="amt"]').textContent = inr(w.amt); el.querySelector('[data-o="inv"]').textContent = lakh(inv);
    el.querySelector('[data-o="fv"]').textContent = lakh(fv); el.querySelector('[data-o="bi"]').style.width = (inv / fv * 100).toFixed(1) + '%';
    const r = el.querySelector('.rng'); if (r !== e.target) r.value = w.amt;
  });
});
function goTo(id) {
  const el = chatEl.querySelector(`[data-w="${id}"]`); if (!el) return;
  chatEl.scrollTo({ top: el.offsetTop - 30, behavior: 'smooth' });
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1100);
}

/* ---------- widget tray: drag the sheet down a little, tiles grow ---------- */
const sheet = $('#sheet'), tiles = $('#tiles'), cmpEl = $('.cmp'), fades = [...document.querySelectorAll('.fade')];
const DROP = 71, SCALE = 141 / 84, LIFT = 35; // matches the Figma "Widget center expanded" frames
let open = false, drag = null, suppress = false, cur_e = 0, rafP = 0, settleT = 0;
// spring easing, sampled into CSS linear() where supported
const EASE = (() => {
  const ok = window.CSS && CSS.supports && CSS.supports('transition-timing-function', 'linear(0, 1)');
  if (!ok) return 'cubic-bezier(.2,.9,.25,1)';
  const k = 190, c = 23, pts = []; let x = 0, v = 0; const dt = 1 / 600;
  for (let i = 0; i <= 60; i++) { pts.push(x.toFixed(4)); for (let j = 0; j < 10; j++) { const a = -k * (x - 1) - c * v; v += a * dt; x += v * dt; } }
  pts[pts.length - 1] = '1'; return `linear(${pts.join(',')})`;
})();
const DUR = 560;
[sheet, tiles, cmpEl, ...fades].forEach((n) => { n.style.willChange = 'transform'; });
fades.forEach((f) => { f.style.transformOrigin = f.classList.contains('l') ? '0 0' : '100% 0'; });
function paint(e, anim) {
  cur_e = e; const c = Math.max(0, Math.min(1, e));
  const t = anim ? `transform ${DUR}ms ${EASE}, opacity 300ms ease` : 'none';
  sheet.style.transition = anim ? `transform ${DUR}ms ${EASE}, top .55s var(--ease), height .55s var(--ease), border-radius .55s` : 'none';
  sheet.style.transform = `translate3d(0,${e * DROP}px,0)`;
  tiles.style.transition = t; tiles.style.transform = `translate3d(0,${e * LIFT}px,0) scale(${1 + e * (SCALE - 1)})`;
  cmpEl.style.transition = t; cmpEl.style.transform = `translate3d(0,${-Math.max(0, e) * DROP}px,0)`;
  fades.forEach((f) => { f.style.transition = t + ', opacity .4s'; f.style.transform = `scale(${(150 - c * 101) / 150},${(117 + c * 71) / 117})`; });
  for (const b of [$('#burger'), $('#more')]) { b.style.transition = anim ? 'opacity .3s' : 'none'; b.style.opacity = 1 - c; b.style.pointerEvents = c > 0.5 ? 'none' : ''; }
  stage.classList.toggle('tray-open', c > 0.5);
}
// the chat's bottom inset is a layout change, so only set it once the motion has settled
function settleChat(v) { clearTimeout(settleT); if (!v) { chatEl.style.bottom = '0px'; return; } settleT = setTimeout(() => { chatEl.style.bottom = DROP + 'px'; }, DUR); }
function setOpen(v) { open = v; paint(v ? 1 : 0, true); settleChat(v); centreActive(); }
function centreActive() { const on = $('#tscroll .tile.on'); if (on) requestAnimationFrame(() => centreTile(on)); }
function down(e) {
  if (e.button > 0) return;
  const g = e.target.closest('#grab,#tiles'); if (!g || !hasTray) return;
  drag = { x0: e.clientX, y0: e.clientY, on: false, id: e.pointerId, hist: [[performance.now(), e.clientY]], base: cur_e };
}
function move(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const dy = (e.clientY - drag.y0) / K, dx = (e.clientX - drag.x0) / K;
  if (!drag.on) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { drag = null; return; }
    if (Math.abs(dy) < 4) return;
    drag.on = true; drag.y0 = e.clientY; drag.base = cur_e; try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
    // pick up from wherever an in-flight animation currently is
    const m = new DOMMatrix(getComputedStyle(sheet).transform); drag.base = m.m42 / DROP; paint(drag.base, false);
  }
  drag.hist.push([performance.now(), e.clientY]); if (drag.hist.length > 6) drag.hist.shift();
  let x = drag.base + (e.clientY - drag.y0) / K / DROP;
  if (x < 0) x = -(1 - 1 / (1 - x * 0.6)) / 0.6 * 0.35; // soft rubber band above
  if (x > 1) x = 1 + (1 - 1 / (1 + (x - 1) * 0.8)) * 0.35; // and below
  drag.x = x;
  if (!rafP) rafP = requestAnimationFrame(() => { rafP = 0; if (drag) paint(drag.x, false); });
  e.preventDefault();
}
function up(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.on) {
    cancelAnimationFrame(rafP); rafP = 0;
    const hst = drag.hist, a = hst[0], b = hst[hst.length - 1];
    const v = (b[1] - a[1]) / K / Math.max(16, b[0] - a[0]); // px per ms
    const projected = (drag.x == null ? cur_e : drag.x) + (v * 120) / DROP; // where a flick would carry it
    suppress = true; setTimeout(() => { suppress = false; }, 60);
    setOpen(projected > 0.5);
  }
  drag = null;
}
stage.addEventListener('pointerdown', down);
addEventListener('pointermove', move, { passive: false });
addEventListener('pointerup', up); addEventListener('pointercancel', up);
$('#grab').addEventListener('click', () => { if (!suppress) setOpen(!open); });

/* ---------- drawer + menu ---------- */
/* ---------- home / landing ---------- */
function renderHome() {
  const all = chats.filter((c) => c.msgs.length);
  const card = (c) => `<button class="sb-card" data-chat="${c.id}"><b>${esc(c.title)}</b><small>${c.date}</small></button>`;
  const item = (c) => `<button class="sb-item" data-chat="${c.id}"><b>${esc(c.title)}</b><small>${c.date}</small></button>`;
  $('#homeGrid').innerHTML = all.slice(0, 4).map(card).join('');
  $('#homeList').innerHTML = all.slice(4).map(item).join('');
}
function postTop(dark) { if (EMB) try { parent.postMessage({ decade: 'agentTop', dark }, '*'); } catch (_) {} }
function goHome() {
  if (open) setOpen(false);
  $('#menu').classList.remove('on'); input.blur();
  stage.classList.remove('inchat'); renderHome(); postTop(false);
}
function enterChat() { stage.classList.add('inchat'); postTop(hasTray); }
function setTab(tab) {
  document.querySelectorAll('.bnav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('.hpage').forEach((pg) => { pg.hidden = pg.dataset.page !== tab; });
}
document.querySelectorAll('.bnav button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#homeAsk').addEventListener('click', () => { newChat(); input.focus(); enterChat(); });
$('#hActions').addEventListener('click', () => toast('Actions isn’t in this prototype yet'));
$('#burger').addEventListener('click', () => goHome());

document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => {
  const to = b.dataset.go;
  if (to === 'portfolio') { toast('Portfolio isn’t in this prototype yet'); return; }
  if (EMB) setTimeout(() => parent.postMessage({ decade: 'go', to }, '*'), 200); else toast(`Opens ${to === 'fd' ? 'Fixed deposit' : 'Mutual funds'} in the app`);
}));
$('#more').addEventListener('click', () => { $('#mOpen').style.display = hasTray ? '' : 'none'; $('#menu').classList.toggle('on'); });
$('#mNew').addEventListener('click', () => { $('#menu').classList.remove('on'); if (cur.msgs.length) newChat(); toast('New consultation'); });
$('#mOpen').addEventListener('click', () => { $('#menu').classList.remove('on'); setOpen(!open); });

newChat(); renderHome();
window.__agent = { send, setOpen, goHome, get cur() { return cur; } };
})();
</script>
